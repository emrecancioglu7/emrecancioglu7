<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Be the change that you want to see in the world."><title>Be the change that you want to see in the world.</title><style>text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .wave { animation: sway 6s ease-in-out infinite alternate; }
    @keyframes sway { to { transform: translateX(-40px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs>
    <path class="wave" d="M0,70 C200,20 400,120 600,70 C800,20 1000,120 1200,70 L1200,150 L0,150Z" fill="url(#g)" opacity="0.18"/>
    <path d="M0,95 C200,55 400,135 600,95 C800,55 1000,135 1200,95 L1200,150 L0,150Z" fill="url(#g)" opacity="0.9"/>
    <text x="600" y="34" font-size="18" font-weight="400" fill="#5b6168" text-anchor="middle" font-style="italic">“Be the change that you want to see in the world.”</text></svg>